alerting:
  github:
    repository-url: ${GITHUB_REPO_URL}
    token: ""

endpoints:
  - name: leantime
    url: http://lks-oss-lb-2032801103.us-east-1.elb.amazonaws.com
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 300"
    alerts:
      - type: github
        failure-threshold: 3
        success-threshold: 5
        send-on-resolved: true

  - name: gatus
    url: http://lks-oss-lb-2032801103.us-east-1.elb.amazonaws.com:8080
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 500"
      