alerting:
  github:
    repository-url: ${GITHUB_REPO_URL}
    token: ${GITHUB_TOKEN}
    default-alert:
      failure-threshold: 3
      success-threshold: 5
      send-on-resolved: true

endpoints:
  - name: leantime
    url: http://lks-oss-lb-826177753.us-east-1.elb.amazonaws.com
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 300"

  - name: gatus
    url: http://lks-oss-lb-826177753.us-east-1.elb.amazonaws.com:8080
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 500"